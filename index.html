<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="Pelacak pekerjaan dan proyek pribadi. Berjalan offline." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Catatan</title>
    <script>
      // Terapkan tema tersimpan sebelum render supaya tidak berkedip.
      try {
        var s = JSON.parse(localStorage.getItem('catatan-v1') || '{}')
        var th = s && s.state && s.state.theme
        if (th) document.documentElement.dataset.theme = th
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
